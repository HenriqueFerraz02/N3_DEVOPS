name: CI - Continuous Integration

on:
  push:
    branches: [develop, feature/**]
  pull_request:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Analise de codigo estatico (ESLint)
        run: npm run lint

      - name: Rodar testes de unidade e cobertura
        run: npm test -- --forceExit

      - name: Instalar Chrome para Selenium
        uses: browser-actions/setup-chrome@v1

      - name: Iniciar aplicacao em background
        run: npm start &

      - name: Aguardar aplicacao iniciar
        run: sleep 5

      - name: Rodar teste Selenium
        run: node test/selenium.test.js
